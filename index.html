<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Diagnostic Viewer</title>
<style>
  :root {
    --bg0: #03050b; --bg1: #070b16; --panel: rgba(14, 21, 38, 0.78); --panel-solid: #0e1526; --line: rgba(120, 160, 220, 0.16);
    --ink: #e6eefc; --muted: #8fa0bd; --faint: #5d6c86; --accent: #5cc6ff; --accent2: #86b6ef;
    --critical: #d03b3b; --serious: #ec835a; --warning: #fab219; --info: #86b6ef; --good: #0ca30c;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--ink); font: 13px/1.45 var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; }
  #app { --lw: 272px; --rw: 330px; display: grid; grid-template-rows: 52px 1fr 30px; grid-template-columns: var(--lw) 1fr var(--rw); height: 100vh; height: 100dvh; }
  #left { grid-area: 2 / 1; } #viewport { grid-area: 2 / 2; } #right { grid-area: 2 / 3; }
  #app.left-closed { --lw: 0px; } #app.left-closed #left { display: none; }
  #app.right-closed { --rw: 0px; } #app.right-closed #right { display: none; }
  #scrim { display: none; }
  .tbtn .n { font-family: var(--mono); color: var(--muted); margin-left: 3px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0b1222, #070b16); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: conic-gradient(from 200deg, #38b6ff, #ffd23f, #ff5e13, #38b6ff); box-shadow: 0 0 18px rgba(56,182,255,.35); flex: none; }
  #title { font-weight: 600; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
  #study { color: var(--muted); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .tbtn { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  .tbtn:hover { border-color: rgba(92,198,255,.5); }
  .tbtn.on { background: rgba(92,198,255,.16); border-color: rgba(92,198,255,.6); color: #dff3ff; }
  select.tbtn { max-width: 230px; background: #0e1526; color: var(--ink); }
  .tbtn.attention { border-color: var(--warning); color: #ffe3a3; animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(250,178,25,.18); } }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .langs button { background: transparent; border: 0; padding: 6px 10px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .langs button.on { background: rgba(92,198,255,.18); color: #fff; }

  aside { background: var(--panel-solid); overflow-y: auto; padding: 12px 14px 20px; border-right: 1px solid var(--line); }
  #right { border-right: 0; border-left: 1px solid var(--line); }
  aside::-webkit-scrollbar { width: 8px; } aside::-webkit-scrollbar-thumb { background: #1d2a44; border-radius: 4px; }
  section { margin-bottom: 16px; }
  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent2); margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h2 .count { font-family: var(--mono); color: var(--muted); background: rgba(255,255,255,.06); border-radius: 10px; padding: 0 7px; letter-spacing: 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg.four { grid-template-columns: repeat(2, 1fr); }
  .seg.four button:nth-child(2) { border-right: 0; } .seg.four button:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .seg button { background: transparent; border: 0; border-right: 1px solid var(--line); padding: 7px 4px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: rgba(92,198,255,.18); color: #fff; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .grid3 button, .wide { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 7px; padding: 6px 4px; cursor: pointer; font-size: 12px; }
  .grid3 button:hover, .wide:hover, .seg button:hover { color: #fff; border-color: rgba(92,198,255,.45); }
  .wide { width: 100%; margin-top: 6px; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
  .toggle.small { font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 4px; }
  input[type=checkbox] { accent-color: #38b6ff; width: 15px; height: 15px; }
  input[type=range] { width: 100%; accent-color: #38b6ff; height: 14px; }
  .layer { display: grid; grid-template-columns: 1fr 70px; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px dashed rgba(120,160,220,.08); }
  .layer label { display: flex; gap: 7px; align-items: center; cursor: pointer; font-size: 12.5px; line-height: 1.2; }
  .readout-line { font-family: var(--mono); font-size: 11.5px; color: #bfe6ff; margin: 6px 0 2px; min-height: 16px; }
  #clipSlider { margin-top: 8px; }
  .legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }

  .findings { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
  .findings > li { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; padding: 8px 10px; background: rgba(255,255,255,.025); cursor: pointer; }
  .findings > li:hover, .findings > li.on { background: rgba(92,198,255,.08); border-color: rgba(92,198,255,.4); border-left-color: var(--c); }
  .findings .row { display: flex; align-items: center; gap: 7px; }
  .findings .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
  .findings .ttl { font-weight: 600; flex: 1; min-width: 0; }
  .findings p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .chip { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 10px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap; }
  ul.doc { margin: 6px 0 0; padding-left: 16px; font-family: var(--mono); font-size: 11px; color: #c5d3ea; }
  ul.doc li { margin: 2px 0; }
  .issues ul { margin: 0; padding-left: 16px; font-family: var(--mono); font-size: 11px; color: #ffd9a0; }
  .issues li { margin: 3px 0; }
  .hint { color: var(--faint); font-size: 12px; }

  #viewport { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #0f1a33 0%, #070b16 55%, #03050b 100%); }
  #viewport canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #markers, #tags { position: absolute; inset: 0; pointer-events: none; }
  .hs { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer; }
  .hs .core { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 12px var(--c), 0 0 2px #000; }
  .hs .ring { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--c); opacity: .7; animation: ping 1.8s ease-out infinite; }
  .hs.sev-info .ring, .hs.sev-good .ring { animation-duration: 2.8s; opacity: .45; }
  @keyframes ping { 0% { transform: scale(.45); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  .hs .tip { position: absolute; left: 13px; top: -9px; white-space: nowrap; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px;
    background: rgba(5,8,15,.82); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); opacity: 0; transform: translateX(-4px); transition: .15s; pointer-events: none; }
  .hs:hover .tip, .hs.active .tip { opacity: 1; transform: none; }
  .hs.active .core { transform: scale(1.25); }
  .tag { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: 11px; color: #d8f0ff; background: rgba(5,8,15,.8); border: 1px solid rgba(92,198,255,.5); border-radius: 5px; padding: 2px 6px; white-space: nowrap; }

  #card { position: absolute; width: 360px; max-height: calc(100% - 104px); overflow-y: auto; background: rgba(9,14,27,.93); backdrop-filter: blur(8px);
    border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line)); border-top: 3px solid var(--c); border-radius: 12px; padding: 12px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.55); z-index: 5; }
  #card.pinned { box-shadow: 0 0 0 1px var(--c), 0 18px 50px rgba(0,0,0,.55); }
  .card-head { display: flex; justify-content: space-between; align-items: center; }
  .card-head .x { background: none; border: 0; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; }
  #card h3 { margin: 6px 0 6px; font-size: 16px; }
  #card h4 { margin: 9px 0 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent2); }
  #card h4.tech { color: #ffcf7a; }
  #card p { margin: 0; color: #cfd9ea; }
  #card .ref { margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .btn { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .btn:hover { border-color: rgba(92,198,255,.5); }
  .btn.on { background: rgba(92,198,255,.18); border-color: rgba(92,198,255,.6); }

  #caption { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(760px, 86%); text-align: center; font-size: 15.5px; line-height: 1.5;
    background: rgba(4,7,14,.82); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; z-index: 4; color: #9fb0ca; }
  #caption .said { color: #e6eefc; } #caption mark { background: rgba(92,198,255,.22); color: #fff; border-radius: 3px; padding: 0 2px; }
  #viewcube { position: absolute; right: 12px; top: 12px; width: 110px; height: 110px; cursor: pointer; z-index: 3; }
  #scalebar { position: absolute; left: 16px; bottom: 16px; font-family: var(--mono); font-size: 11px; color: #bfe6ff; z-index: 3; }
  #scalebar .bar { height: 6px; border: 2px solid #bfe6ff; border-top: 0; margin-bottom: 3px; }
  #readout { position: absolute; right: 14px; bottom: 16px; font-family: var(--mono); font-size: 11.5px; color: #cfe8ff; background: rgba(4,7,14,.7); border-radius: 6px; padding: 3px 8px; z-index: 3; max-width: 55%; text-align: right; }
  #readout:empty { display: none; }
  #voiceHint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #2a1f08; box-shadow: 0 6px 20px rgba(0,0,0,.5); border: 1px solid rgba(250,178,25,.5); color: #ffe3a3; border-radius: 9px; padding: 6px 12px; z-index: 6; font-size: 12.5px; }
  .thumbs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 6px; }
  .thumb { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; aspect-ratio: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
  .thumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 2px 5px; background: rgba(0,0,0,.65); color: #cfe0f5; text-align: left; }
  .thumb:hover { border-color: rgba(92,198,255,.6); } .thumb:hover img { opacity: 1; }
  #slicebox { position: absolute; left: 16px; top: 16px; width: min(440px, 46%); background: rgba(6,9,18,.95); border: 1px solid rgba(92,198,255,.4); border-radius: 12px; padding: 10px 12px 12px; z-index: 6; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  .sb-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
  .sb-head .x { background: none; border: 0; font-size: 20px; color: var(--muted); cursor: pointer; }
  .sb-img { position: relative; border-radius: 6px; overflow: hidden; background: #000; }
  .sb-img img { width: 100%; display: block; }
  .sb-img .o { position: absolute; font-family: var(--mono); font-size: 12px; color: #ffd75e; text-shadow: 0 0 3px #000; }
  .o.t { top: 4px; left: 50%; transform: translateX(-50%); } .o.b { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .o.l { left: 6px; top: 50%; transform: translateY(-50%); } .o.r { right: 6px; top: 50%; transform: translateY(-50%); }
  .sdot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 35%, transparent); cursor: pointer; padding: 0; box-shadow: 0 0 8px var(--c); }
  .sbar { position: absolute; left: 10px; bottom: 22px; height: 4px; border: 2px solid #bfe6ff; border-top: 0; }
  .sbar-l { position: absolute; left: 10px; bottom: 6px; font-family: var(--mono); font-size: 10.5px; color: #bfe6ff; }
  .sb-note { margin-top: 6px; font-size: 11px; color: #c9a86a; }
  #slicebox.mini { width: 200px; padding: 6px 8px 8px; } #slicebox.mini .sb-head { font-size: 11px; margin-bottom: 4px; }
  #slicebox.mini .sb-note, #slicebox.mini .card-actions, #slicebox.mini .sbar-l, #slicebox.mini .sbar { display: none; }
  #slicebox.mini .sb-img img { cursor: zoom-in; } #slicebox.mini .sdot { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; letter-spacing: .05em; }
  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--faint); background: #05080f; white-space: nowrap; overflow: hidden; }
  #disclaimer { color: #c9a86a; flex: none; }
  .keys { font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.6; }
  #attribution { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #errs { color: #ff8a8a; font-family: var(--mono); }
  @media (max-width: 1360px) { #app { --lw: 240px; --rw: 290px; } #study { display: none; } }
  @media (max-width: 1100px) { #app { --lw: 220px; } }
  /* phone: the 3D view takes the screen; both panels are drawers over it */
  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto; } #viewport { grid-area: 2 / 1; }
    header { gap: 6px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
    header::-webkit-scrollbar { display: none; }
    .brand, #study, .tbtn .lbl { display: none; }
    .tbtn { padding: 6px 8px; flex: none; } .langs { flex: none; } .langs button { padding: 6px 8px; }
    select.tbtn { max-width: 92px; }
    #app aside { display: block; position: fixed; top: 48px; bottom: 0; width: min(86vw, 340px); z-index: 30; transition: transform .22s ease; box-shadow: 0 0 40px rgba(0,0,0,.6); }
    #left { left: 0; transform: translateX(-102%); } #app.left-open #left { transform: none; }
    #right { right: 0; transform: translateX(102%); } #app.right-open #right { transform: none; }
    #scrim { display: block; position: fixed; inset: 48px 0 0 0; background: rgba(0,0,0,.45); z-index: 25; }
    #scrim[hidden] { display: none; }
    footer { flex-wrap: wrap; gap: 2px 10px; padding: 4px 8px; font-size: 10px; line-height: 1.3; white-space: normal; }
    #disclaimer { flex: 1 1 100%; } #attribution { white-space: normal; }
    #viewcube { width: 64px; height: 64px; right: 8px; top: 8px; }
    #caption { top: 8px; bottom: auto; left: 8px; right: 80px; transform: none; max-width: none; font-size: 12.5px; line-height: 1.4; padding: 6px 10px; }
    #voiceHint { top: auto; bottom: 12px; left: 8px; right: 8px; transform: none; text-align: center; }
    #card { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 52%; }
    #slicebox { left: 8px; right: 8px; top: 80px; width: auto; } #slicebox.mini { right: auto; width: 140px; top: 8px; }
    #readout { bottom: 10px; right: 8px; } #scalebar { bottom: 10px; left: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="tbtn" id="leftBtn" aria-controls="left">☰</button>
    <div class="brand"><div class="logo"></div><div id="title"></div></div>
    <div id="study"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="voiceBtn"></button>
    <select class="tbtn" id="ttsVoice" hidden></select>
    <button class="tbtn" id="animBtn"></button>
    <button class="tbtn" id="doctorBtn"></button>
    <div class="langs"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    <button class="tbtn" id="rightBtn" aria-controls="right"></button>
  </header>
  <aside id="left"></aside>
  <main id="viewport">
    <div id="loading"></div>
    <div id="markers"></div>
    <div id="tags" hidden></div>
    <div id="card" hidden></div>
    <div id="caption" hidden></div>
    <canvas id="viewcube" width="220" height="220"></canvas>
    <div id="scalebar"><div class="bar"></div><div class="lbl"></div></div>
    <div id="readout"></div>
    <div id="voiceHint" hidden></div>
    <div id="slicebox" hidden></div>
  </main>
  <aside id="right"></aside>
  <div id="scrim" hidden></div>
  <footer><span id="disclaimer"></span><span id="attribution"></span><span id="errs" hidden></span></footer>
</div>
<script src="data/geometry.js"></script>
<script src="data/hotspots.js"></script>
<script src="data/slices.js" onerror="window.SLICES=[]"></script>
<script>window.VIEWER_CONFIG = {"clips": false, "study": false};</script>
<script src="app.bundle.js"></script>
</body>
</html>
